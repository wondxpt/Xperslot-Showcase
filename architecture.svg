<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="t d">
  <title id="t">Xperslot conceptual product architecture</title>
  <desc id="d">High-level product architecture showing separate business and customer experiences connecting through guarded application APIs to booking, client, messaging, and calendar capabilities with managed identity and data services.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#EFF6F9"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F2A3D"/><stop offset="1" stop-color="#164E63"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F766E"/><stop offset="1" stop-color="#14B8A6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity=".08"/></filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6z" fill="#64748B"/></marker>
  </defs>
  <rect width="1120" height="540" rx="24" fill="url(#canvas)"/>
  <text x="48" y="51" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800">XPERSLOT · CONCEPTUAL ARCHITECTURE</text>
  <text x="48" y="77" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">High-level product view — not a deployment or security topology.</text>
  <g filter="url(#shadow)">
    <rect x="45" y="119" width="222" height="102" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="45" y="119" width="7" height="102" rx="4" fill="url(#teal)"/>
    <text x="68" y="151" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="750">Business experience</text>
    <text x="68" y="175" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Calendar · Staff · Services</text>
    <text x="68" y="194" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Clients · Workspace tools</text>
    <rect x="45" y="244" width="222" height="102" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="45" y="244" width="7" height="102" rx="4" fill="#0EA5E9"/>
    <text x="68" y="276" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="750">Customer experience</text>
    <text x="68" y="300" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Discover · Choose service</text>
    <text x="68" y="319" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Book · Manage appointments</text>
    <rect x="364" y="171" width="220" height="122" rx="17" fill="url(#navy)"/>
    <text x="474" y="205" fill="#99F6E4" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">APPLICATION LAYER</text>
    <text x="474" y="235" fill="#FFFFFF" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750">API &amp; access rules</text>
    <text x="474" y="260" fill="#D1E5EE" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Tenant · Membership · Roles</text>
    <rect x="682" y="112" width="392" height="250" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="710" y="145" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="750">Product capabilities</text>
    <rect x="706" y="164" width="162" height="68" rx="11" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="787" y="190" text-anchor="middle" fill="#065F46" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">Booking engine</text>
    <text x="787" y="210" text-anchor="middle" fill="#047857" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Availability · Appointments</text>
    <rect x="883" y="164" width="166" height="68" rx="11" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="966" y="190" text-anchor="middle" fill="#1E40AF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">Client management</text>
    <text x="966" y="210" text-anchor="middle" fill="#1D4ED8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Profiles · Business data</text>
    <rect x="706" y="248" width="162" height="68" rx="11" fill="#F5F3FF" stroke="#DDD6FE"/>
    <text x="787" y="274" text-anchor="middle" fill="#5B21B6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">Messaging</text>
    <text x="787" y="294" text-anchor="middle" fill="#6D28D9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Client &amp; team workflows</text>
    <rect x="883" y="248" width="166" height="68" rx="11" fill="#F0FDFA" stroke="#99F6E4"/>
    <text x="966" y="274" text-anchor="middle" fill="#115E59" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">Integrations</text>
    <text x="966" y="294" text-anchor="middle" fill="#0F766E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">OAuth · Calendar sync</text>
    <rect x="352" y="405" width="340" height="78" rx="15" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#shadow)"/>
    <text x="522" y="436" text-anchor="middle" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="750">Identity &amp; data services</text>
    <text x="522" y="459" text-anchor="middle" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Supabase Auth · PostgreSQL · access policies</text>
  </g>
  <g fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arr)">
    <path d="M267 170H340V206H357"/>
    <path d="M267 295H329V257H357"/>
