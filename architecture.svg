  <text x="710" y="414" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Illustrative product boundaries; implementation evolves over time.</text>
  <text x="48" y="510" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Xperslot · Product overview · Source code is maintained in a private repository</text>
